# Include these locations before the landing `location /` fallback.
# `crm-api` is the API service name on the shared edge network.
location ^~ /public/v1/ {
    proxy_pass http://crm-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # This is the only trusted edge hop. Never preserve a client-supplied X-Forwarded-For value.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 11m;
}

location ^~ /api/v1/ {
    proxy_pass http://crm-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 11m;
}

location ^~ /internal/v1/ {
    proxy_pass http://crm-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 11m;
}

location = /health/live {
    proxy_pass http://crm-api:8080;
}

location = /health/ready {
    proxy_pass http://crm-api:8080;
}
