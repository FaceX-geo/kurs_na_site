name: kurs_na_site

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA:-development}
    env_file:
      - path: .env.local
        required: false
    image: ${LANDING_IMAGE:-kurs-na-site:local}
    container_name: kurs_na_site
    restart: unless-stopped
    labels:
      facex.release.sha: ${RELEASE_SHA:-development}
    ports:
      - "8105:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
