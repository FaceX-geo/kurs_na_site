upstream crm_api_upstream {
  server __CRM_API_UPSTREAM__;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  # The default build resolves CRM through the shared Compose network. The
  # managed edge build injects the private Bravo landing hop instead. These
  # routes must stay before the static SPA fallback below.
  location = /public/v1 {
    return 308 /public/v1/;
  }

  location = /api/v1 {
    return 308 /api/v1/;
  }

  location = /internal/v1 {
    return 308 /internal/v1/;
  }

  location ^~ /public/v1/ {
    proxy_pass http://crm_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto __CRM_FORWARDED_PROTO__;
    proxy_set_header X-Forwarded-For __CRM_FORWARDED_CLIENT_IP__;
    proxy_set_header X-Real-IP __CRM_FORWARDED_CLIENT_IP__;
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 11m;
  }

  location ^~ /api/v1/ {
    proxy_pass http://crm_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto __CRM_FORWARDED_PROTO__;
    proxy_set_header X-Forwarded-For __CRM_FORWARDED_CLIENT_IP__;
    proxy_set_header X-Real-IP __CRM_FORWARDED_CLIENT_IP__;
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 11m;
  }

  location ^~ /internal/v1/ {
    proxy_pass http://crm_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto __CRM_FORWARDED_PROTO__;
    proxy_set_header X-Forwarded-For __CRM_FORWARDED_CLIENT_IP__;
    proxy_set_header X-Real-IP __CRM_FORWARDED_CLIENT_IP__;
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 11m;
  }

  location = /health/live {
    proxy_pass http://crm_api_upstream;
  }

  location = /health/ready {
    proxy_pass http://crm_api_upstream;
  }

  location = /cabinet {
    return 308 /cabinet/;
  }

  location = /cabinet/index.html {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  location ^~ /cabinet/assets/ {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  location ^~ /cabinet/ {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/ /cabinet/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ /\.(?!well-known) {
    deny all;
  }
}
